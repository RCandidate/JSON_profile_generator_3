server {
    listen 8080;
    server_name generator.gen.pro;

    access_log /var/log/angie/generator.access.log;
    error_log /var/log/angie/generator.error.log;

    # Основной маршрут для генератора
    location /generator/ {
        # Проксируем на порт 8182, который слушает ваш Docker-контейнер
        proxy_pass http://127.0.0.1:8182/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # КРИТИЧЕСКИ ВАЖНО для работы прогресс-бара и логов (SSE)
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Увеличенные таймауты, так как генерация с LLM может быть долгой
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_cache off;
        proxy_store off;
    }

    # Проксирование статических файлов Flask
    # Браузер запрашивает их по абсолютному пути /static/...
    location /static/ {
        proxy_pass http://127.0.0.1:8182/static/;
    }
}
