<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <title>Generator - Brand-New Life</title>

    <!-- Используем относительные пути (без первого слеша), чтобы Angie проксировал их правильно -->
    <link rel="shortcut icon" href="static/favicon.ico">
    <link rel="stylesheet" href="static/vintage.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
</head>


<body>
<div class="terminal-wrapper">

    <div class="header">
        <div class="header-bar">
            <div class="dot dot-r"></div>
            <div class="dot dot-y"></div>
            <div class="dot dot-g"></div>
        </div>
        <span class="header-title">profile_generator.py</span>
        <div style="display:flex;align-items:baseline;gap:8px;">
            <h1>GEN//SMART</h1>
            <span class="version-tag">v 3.3</span>
        </div>
        <span class="subtitle">// SOCIOLOGICAL IDENTITY SYNTHESIS //</span>
    </div>

    <div class="main-grid">
        <div class="panel">
            <div class="section-label">[ INPUT CONFIGURATION ]</div>

            <div class="form-group">
                <label>&#9656; File proxy</label>
                <div class="select-wrap">
                    <select id="proxy_file">
                        {% for f in proxy_files %}
                            <option value="{{ f }}">{{ f }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="stats-badge" id="proxy_stats">
                    <span class="stat-item">
                        <span class="stat-val" id="proxy_count">&mdash;</span>
                        <span>lines</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-val" id="proxy_capacity">&mdash;</span>
                        <span>max</span>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label>&#9656; File profiles</label>
                <div class="select-wrap">
                    <select id="profile_file">
                        {% for f in profile_files %}
                            <option value="{{ f.value }}">{{ f.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="stats-badge" id="profile_stats">
                    <span class="stat-item">
                        <span class="stat-val" id="profile_total">&mdash;</span>
                        <span>total</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-val" id="profile_valid">&mdash;</span>
                        <span>valid</span>
                    </span>
                </div>
            </div>

            <div class="section-label">[ PROXY OPTIONS ]</div>
            <div class="options-block">
                <label>
                    <input type="checkbox" id="allow_dup">
                    <span>Allow duplicate proxies for backup fields</span>
                </label>
                <div class="reuse-row" id="reuseRow">
                    <label>Max reuse per proxy:</label>
                    <input type="number" id="max_reuse" value="2" min="1" max="99">
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="section-label">[ GENERATION SETTINGS ]</div>

            <div class="count-row">
                <label style="margin:0; white-space:nowrap;">&#9656; Count:</label>
                <input type="number" id="count" value="10" min="1" style="width:120px;">
                <div class="capacity-hint" id="capacity_hint"></div>
            </div>

            <div class="section-label" style="margin-top:8px;">[ INTERESTS MODIFIERS ]</div>

            <div class="options-block">
                <label>
                    <input type="checkbox" id="modify_interests">
                    <span>Modify Interests (via LLM)</span>
                </label>
                <div class="reuse-row" id="llmRow" style="padding-left: 32px; margin-top: 8px;">
                    <label>Select LLM:</label>
                    <select id="llm_provider" style="width: 100%; cursor: pointer;">
                        <option value="llm7" selected>llm7.io (default)</option>
                        <option value="mistral">Mistral</option>
                    </select>
                </div>
                <label>
                    <input type="checkbox" id="shrink_intention" checked>
                    <span>Shrink intention</span>
                </label>
            </div>

            <div class="num-input-row">
                <label for="limit_interests">Limit interests to:</label>
                <input type="number" id="limit_interests" value="0" min="0" title="0 = disabled">
                <label for="dummy_interests" style="margin-left:16px;">Add dummy interests to:</label>
                <input type="number" id="dummy_interests" value="0" min="0" title="0 = disabled">
            </div>

            <button class="btn-generate" id="btnGenerate" onclick="doGenerate()">
                <span>&#9889; GENERATE</span>
            </button>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="status-line" id="statusLine"></div>
        </div>
    </div>

    <div class="result-panel" id="resultPanel">
        <div class="result-header">
            <span class="result-title">[ OUTPUT // JSON ]</span>
            <div class="result-actions">
                <button class="btn-small" onclick="doCopy()">[ COPY ]</button>
                <button class="btn-small" onclick="doDownload()">[ SAVE ]</button>
            </div>
        </div>
        <textarea id="outputArea" readonly spellcheck="false"></textarea>
    </div>

    <div class="footer">
        <span>TARJA.DRACH.PRO // GENERATOR MODULE</span>
        <div class="footer-right">
            <span class="footer-accent" id="footerStats">READY</span>
            <span class="footer-llm" id="footerLlm" style="display:none;"></span>
        </div>
    </div>

</div>

<script>
    const cbDup = document.getElementById('allow_dup');
    const reuseRow = document.getElementById('reuseRow');
    cbDup.addEventListener('change', function() {
        reuseRow.classList.toggle('active', this.checked);
    });

    const cbMod = document.getElementById('modify_interests');
    const llmRow = document.getElementById('llmRow');
    // Инициализация начального состояния
    llmRow.classList.toggle('active', cbMod.checked);
    cbMod.addEventListener('change', function() {
        llmRow.classList.toggle('active', this.checked);
    });

    async function loadStats() {
        const proxyFile    = document.getElementById('proxy_file').value;
        const profileFile  = document.getElementById('profile_file').value;

        setEl('proxy_count',    '\u2026');
        setEl('proxy_capacity', '\u2026');
        setEl('profile_total',  '\u2026');
        setEl('profile_valid',  '\u2026');
        setEl('capacity_hint',  '');

        if (!proxyFile || !profileFile) return;

        try {
            const resp = await fetch('/generator/stats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ proxy_file: proxyFile, profile_file: profileFile })
            });

            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                showStatus('err', '\u26A0 ' + (err.error || 'Stats error'));
                return;
            }

            const d = await resp.json();
            const allowDup = document.getElementById('allow_dup').checked;
            const maxReuse = parseInt(document.getElementById('max_reuse').value) || 1;

            let maxProfiles;

            if (allowDup) {
                maxProfiles = d.proxy_count;
            } else {
                let remaining = d.proxy_count;
                maxProfiles = 0;
                while (remaining > 0) {
                    remaining -= 1;
                    maxProfiles += 1;
                    if (remaining >= 2) {
                        remaining -= 2;
                    } else if (remaining === 1) {
                        remaining -= 1;
                    }
                }
            }

            const colorP = maxProfiles > 0 ? 'ok' : 'warn';
            const colorV = d.profile_valid > 0 ? 'ok' : 'warn';

            setEl('proxy_count',    d.proxy_count,    colorP);
            setEl('proxy_capacity', maxProfiles,       colorP);
            setEl('profile_total',  d.profile_total,  '');
            setEl('profile_valid',  d.profile_valid,  colorV);

            const hint = maxProfiles > 0
                ? '<span class="cap-num">' + maxProfiles + '</span> max profiles'
                : '<span style="color:var(--danger)">not enough proxies</span>';
            document.getElementById('capacity_hint').innerHTML = hint;

            const countEl = document.getElementById('count');
            countEl.max = maxProfiles || 1;
            if (parseInt(countEl.value) > maxProfiles) countEl.value = maxProfiles;

        } catch(e) {
            showStatus('err', '\u26A0 Network error loading stats');
        }
    }

    function setEl(id, val, cls) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = val;
        el.className = 'stat-val' + (cls ? ' ' + cls : '');
    }

    document.getElementById('proxy_file').addEventListener('change', loadStats);
    document.getElementById('profile_file').addEventListener('change', loadStats);
    document.getElementById('allow_dup').addEventListener('change', loadStats);
    document.getElementById('max_reuse').addEventListener('input', loadStats);
    window.addEventListener('DOMContentLoaded', loadStats);

    async function doGenerate() {
        const btn    = document.getElementById('btnGenerate');
        const count  = parseInt(document.getElementById('count').value) || 0;

        if (count <= 0) { showStatus('err', '\u26A0 Count must be > 0'); return; }

        btn.disabled = true;
        showStatus('info', 'Synthesizing profiles\u2026');
        animateProgress();

        const body = {
            proxy_file:       document.getElementById('proxy_file').value,
            profile_file:     document.getElementById('profile_file').value,
            count:            count,
            allow_dup:        document.getElementById('allow_dup').checked,
            max_reuse:        parseInt(document.getElementById('max_reuse').value) || 1,
            modify_interests: document.getElementById('modify_interests').checked,
            llm_provider:     document.getElementById('llm_provider').value,
            shrink_intention: document.getElementById('shrink_intention').checked,
            limit_interests:  parseInt(document.getElementById('limit_interests').value) || 0,
            dummy_interests:  parseInt(document.getElementById('dummy_interests').value) || 0
        };

        try {
            const resp = await fetch('/generator/generate', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(body)
            });

            stopProgress(resp.ok);

            if (!resp.ok) {
                const text = await resp.text();
                let msg = 'Server error ' + resp.status;
                try {
                    const j = JSON.parse(text);
                    msg = j.error || msg;
                } catch(_) {
                    msg += ' (not JSON)';
                }
                showStatus('err', '\u2716 ' + msg);
                btn.disabled = false;
                return;
            }

            const data = await resp.json();
            const out  = document.getElementById('outputArea');
            out.value  = JSON.stringify(data.profiles, null, 2);

            const panel = document.getElementById('resultPanel');
            panel.classList.add('visible');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            const isWarn = data.message && data.message.startsWith('WARNING');
            showStatus(isWarn ? 'warn' : 'ok',
                (isWarn ? '\u26A0 ' : '\u2714 ') + (data.message || 'Done'));

            document.getElementById('footerStats').textContent =
                'GENERATED: ' + data.profiles.length + ' PROFILES';

            const llmCount = data.stats && data.stats.llm_modified_count;
            const llmEl = document.getElementById('footerLlm');
            if (llmCount !== undefined && llmCount > 0) {
                llmEl.textContent = 'LLM MODIFIED: ' + llmCount;
                llmEl.style.display = 'inline';
            } else {
                llmEl.style.display = 'none';
            }

        } catch(e) {
            stopProgress(false);
            showStatus('err', '\u2716 Network error: ' + e.message);
        }

        btn.disabled = false;
        loadStats();
    }

    function showStatus(type, msg) {
        const el = document.getElementById('statusLine');
        const cls = { ok: 'status-ok', warn: 'status-warn', err: 'status-err', info: '' }[type] || '';
        el.innerHTML = '<span class="' + cls + '">' + msg + '</span>' +
            (type === 'info' ? '<span class="cursor-blink"></span>' : '');
    }

    let _progTimer = null;
    function animateProgress() {
        const wrap = document.getElementById('progressWrap');
        const bar  = document.getElementById('progressBar');
        wrap.classList.add('visible');
        bar.style.width = '0%';
        let w = 0;
        _progTimer = setInterval(() => {
            w = Math.min(w + Math.random() * 8, 88);
            bar.style.width = w + '%';
        }, 200);
    }
    function stopProgress(success) {
        clearInterval(_progTimer);
        const bar = document.getElementById('progressBar');
        bar.style.width = success ? '100%' : '0%';
        if (!success) bar.style.background = 'var(--danger)';
        setTimeout(() => {
            document.getElementById('progressWrap').classList.remove('visible');
            bar.style.background = '';
        }, 600);
    }

    function doCopy() {
        const text = document.getElementById('outputArea').value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showStatus('ok', '\u2714 Copied to clipboard');
            }).catch(() => {
                fallbackCopy();
            });
        } else {
            fallbackCopy();
        }
    }

    function fallbackCopy() {
        const ta = document.getElementById('outputArea');
        ta.select();
        document.execCommand('copy');
        showStatus('ok', '\u2714 Copied to clipboard!');
    }

    function doDownload() {
        const text = document.getElementById('outputArea').value;
        const blob = new Blob([text], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = 'profiles_output.json';
        a.click();
        URL.revokeObjectURL(url);
        showStatus('ok', '\u2714 File saved');
    }
</script>
</body>
</html>
